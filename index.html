<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Francis le Coq — Chicken Mines</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><text y='54' font-size='56'>🦊</text></svg>">
<style>
@import url('https://fonts.googleapis.com/css2?family=Bangers&family=Fredoka+One&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
:root{
  --bg1:#0d0520; --bg2:#1a0840;
  --gold:#FFD700; --purple:#c084fc; --purple-d:#6d28d9;
  --green:#16a34a; --green-l:#a3e635;
  --orange:#d97706; --orange-l:#fcd34d;
  --cyan:#0ea5e9;
  --txt:#fff; --muted:#c9aaee;
}
html,body{height:100%}
body{
  background:linear-gradient(160deg,var(--bg1),var(--bg2));
  background-attachment:fixed;
  font-family:'Fredoka One',cursive;
  color:var(--txt);
  min-height:100vh;
  display:flex; flex-direction:column; align-items:center;
  padding:14px 14px calc(14px + env(safe-area-inset-bottom));
  overflow-x:hidden;
}
body::before{
  content:''; position:fixed; top:-120px; left:50%; transform:translateX(-50%);
  width:380px; height:380px; border-radius:50%;
  background:radial-gradient(circle,rgba(120,40,200,0.35),transparent 70%);
  pointer-events:none; z-index:0;
}
.app{width:100%; max-width:420px; position:relative; z-index:1; display:flex; flex-direction:column; align-items:center}

/* HEADER */
.brand{display:flex; flex-direction:column; align-items:center; margin-bottom:14px; margin-top:4px}
.brand img{width:110px; height:110px; object-fit:contain; filter:drop-shadow(0 6px 18px rgba(0,0,0,0.6)); animation:bob 3.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-7px) rotate(1deg)}}
.brand h1{
  font-family:'Bangers',cursive; font-size:34px; letter-spacing:3px;
  color:var(--gold); text-shadow:0 0 22px rgba(255,215,0,0.55),0 3px 0 rgba(0,0,0,0.35);
  margin-top:4px; line-height:1; text-align:center;
}
.brand .tagline{font-size:11px; color:var(--muted); letter-spacing:1px; margin-top:3px}

/* CARD */
.card{
  width:100%;
  background:linear-gradient(145deg,rgba(13,5,32,0.95),rgba(30,10,65,0.95));
  border:2px solid rgba(180,100,255,0.30);
  border-radius:24px; padding:22px 18px;
  box-shadow:0 0 50px rgba(120,40,200,0.35);
}

/* PLAYING FULLSCREEN */
body.playing{padding:0; justify-content:flex-start}
body.playing .brand{display:none}
body.playing .app{max-width:480px}
body.playing #screenGame.card{
  border:none; border-radius:0; box-shadow:none; background:transparent;
  padding:10px 10px calc(14px + env(safe-area-inset-bottom));
  min-height:100vh; display:flex; flex-direction:column;
}

/* MENU BUTTONS */
.menu-btn{
  width:100%; padding:18px 18px; border:none; border-radius:16px;
  font-family:'Bangers',cursive; font-size:22px; letter-spacing:2px;
  color:#fff; cursor:pointer; margin-bottom:14px;
  display:flex; align-items:center; justify-content:center; gap:12px;
  touch-action:manipulation; transition:transform .12s,box-shadow .12s,opacity .12s;
  position:relative; overflow:hidden;
}
.menu-btn:active{transform:scale(0.97)}
.menu-btn .ico{font-size:24px; line-height:1}
.menu-btn .lock{position:absolute; right:14px; display:flex; align-items:center; justify-content:center}
.menu-btn .lock svg{width:22px; height:22px; display:block}
#btnWallet{padding-right:44px; padding-top:12px; padding-bottom:12px; font-size:18px}
.wallet-text{display:flex; flex-direction:column; align-items:center; line-height:1.1}
.wallet-sub{font-family:'Fredoka One',cursive; font-size:10px; letter-spacing:0.5px; margin-top:3px; opacity:.95}
.wallet-sub.ok{color:#bbf7d0}
.wallet-sub.warn{color:#fde68a}

.btn-comp-green{background:linear-gradient(135deg,#16a34a,#15803d); box-shadow:0 5px 22px rgba(22,163,74,0.45)}
.btn-comp-orange{background:linear-gradient(135deg,#d97706,#b45309); box-shadow:0 5px 22px rgba(217,119,6,0.40)}
.btn-unique{background:linear-gradient(135deg,#16a34a,#15803d); box-shadow:0 5px 22px rgba(22,163,74,0.45)}
.btn-wallet{background:linear-gradient(135deg,#0ea5e9,#0284c7); box-shadow:0 5px 22px rgba(14,165,233,0.45)}
.btn-purple{background:linear-gradient(135deg,#7c3aed,#5b21b6); box-shadow:0 5px 22px rgba(124,58,237,0.45)}

/* STATUS BAR */
.status-bar{border-radius:14px; padding:12px 14px; margin-bottom:16px; font-size:12px; line-height:1.6; font-family:'Fredoka One',cursive}
.status-bar.franc{background:rgba(22,163,74,0.15); border:1.5px solid rgba(163,230,53,0.5); color:#86efac}
.status-bar.no-franc{background:rgba(217,119,6,0.10); border:1.5px solid rgba(217,119,6,0.4); color:var(--orange-l)}
.status-bar b{color:var(--gold)}

/* LANGUAGE FLAGS */
.lang-row{display:flex; justify-content:center; gap:14px; margin-top:6px}
.flag-btn{
  width:66px; height:46px; border-radius:12px; cursor:pointer;
  border:2px solid rgba(168,85,247,0.4); background:rgba(255,255,255,0.05);
  display:flex; align-items:center; justify-content:center;
  touch-action:manipulation; transition:transform .12s,border-color .12s; overflow:hidden;
}
.flag-btn:active{transform:scale(0.92)}
.flag-btn.active{border-color:var(--gold); box-shadow:0 0 18px rgba(255,215,0,0.45)}
.flag-btn svg{width:48px; height:32px; border-radius:4px; display:block}

/* BACK BUTTON */
.back-btn{
  display:flex; align-items:center; gap:6px; width:100%;
  background:rgba(109,40,217,0.2); border:1px solid rgba(168,85,247,0.4);
  color:#a78bfa; font-size:14px; font-family:'Fredoka One',cursive;
  cursor:pointer; margin-bottom:16px; padding:9px 14px; border-radius:10px;
  touch-action:manipulation; transition:opacity .12s,transform .12s;
}
.back-btn:active{opacity:.7; transform:scale(0.98)}
.back-btn::before{content:'←'; font-size:18px; font-weight:bold}

/* SECTION TITLE */
.sec-title{font-family:'Bangers',cursive; font-size:24px; letter-spacing:2px; color:var(--purple); text-align:center; margin-bottom:14px}
.sec-sub{font-size:11px; color:var(--muted); text-align:center; margin-top:-8px; margin-bottom:16px; line-height:1.5}

/* SCORES */
.total-box{margin-top:12px; text-align:center; font-size:13px; color:var(--muted)}
.total-box b{font-family:'Bangers',cursive; font-size:24px; color:var(--gold); letter-spacing:1px; display:block; margin-top:4px}

/* LEVEL LIST — one card per level: title, access line, then the two records */
.lvl-btn{
  width:100%; padding:14px 16px; border-radius:18px; margin-bottom:12px;
  cursor:pointer; display:flex; flex-direction:column; align-items:stretch; gap:3px;
  text-align:left; touch-action:manipulation; transition:transform .1s; position:relative;
  font-family:'Fredoka One',cursive; color:#fff;
}
.lvl-btn:active{transform:scale(0.98)}
.lvl-btn.unlocked{background:rgba(16,72,52,0.55); border:2px solid rgba(74,222,128,0.75); box-shadow:0 4px 20px rgba(22,163,74,0.25)}
.lvl-btn.lockedb{background:rgba(76,44,10,0.5);  border:2px solid rgba(251,191,36,0.6); box-shadow:0 4px 20px rgba(217,119,6,0.2)}
.lvl-btn .lvl-head{display:flex; align-items:center; gap:9px}
.lvl-btn .stars{font-size:15px; letter-spacing:1px; flex:none}
.lvl-btn .lvl-name{
  font-family:'Fredoka One',cursive; font-size:19px; letter-spacing:.5px;
  color:#fff; line-height:1.15; flex:1;
}
.lvl-btn .lk{display:flex; flex:none; opacity:.9}
.lvl-btn .lk svg{width:22px;height:22px;display:block}
.lvl-btn .lvl-meta{font-size:11.5px; color:var(--muted); letter-spacing:.2px; margin-bottom:5px}
.lvl-btn .lvl-rec{font-size:13px; color:#e9d5ff; letter-spacing:.2px; line-height:1.5}
.lvl-btn .lvl-rec b{font-family:'Bangers',cursive; font-size:19px; letter-spacing:1px; color:var(--green-l); font-weight:400}
.lvl-btn.lockedb .lvl-rec b{color:var(--orange-l)}
.world-sep{font-family:'Bangers',cursive; font-size:13px; letter-spacing:1px; color:var(--purple); margin:14px 0 8px; text-align:left; opacity:.85}
.world-sep:first-child{margin-top:0}

/* GAME SCREEN */
.game-top{display:flex; align-items:center; justify-content:space-between; width:100%; margin-bottom:8px; gap:8px}
.game-top .lvl-badge{font-family:'Bangers',cursive; letter-spacing:1px; font-size:15px; color:var(--gold); flex:1; text-align:center}
.hud{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; width:100%; margin-bottom:10px}
.hud .chip{
  background:rgba(255,255,255,0.06); border:1px solid rgba(168,85,247,0.3);
  border-radius:12px; padding:5px 12px; font-size:13px; display:flex; align-items:center; gap:6px;
}
.hud .chip .lab{font-size:9px; color:var(--muted); letter-spacing:.5px}
.hud .chip .num{font-family:'Bangers',cursive; font-size:17px; letter-spacing:1px}
.chip.foxes .num{color:#fb923c}
.chip.time .num{color:var(--green-l)}
.chip.best .num{color:var(--gold)}

/* BOARD */
.board-wrap{width:100%; display:flex; justify-content:center; flex:1; align-items:center}
.board{
  display:grid; gap:3px; padding:8px;
  border:3px solid var(--purple-d); border-radius:16px;
  box-shadow:0 0 30px rgba(120,40,200,0.4);
  background:#1d0a3d; touch-action:none;
}
.cell{
  position:relative; width:100%; aspect-ratio:1; border-radius:6px;
  display:flex; align-items:center; justify-content:center;
  font-family:'Bangers',cursive; letter-spacing:1px; line-height:1;
  background:linear-gradient(145deg,#7c3aed,#5b21b6);
  box-shadow:inset 0 -2px 0 rgba(0,0,0,0.25), 0 1px 2px rgba(0,0,0,0.35);
  cursor:pointer; overflow:hidden; transition:transform .08s;
}
.cell:active{transform:scale(0.93)}
.cell.rev{
  background:rgba(255,255,255,0.06); box-shadow:inset 0 0 0 1px rgba(168,85,247,0.18);
  cursor:default; animation:cellpop .18s ease-out;
}
@keyframes cellpop{from{transform:scale(.82);opacity:.4}to{transform:scale(1);opacity:1}}
.cell.rev:active{transform:none}
.cell svg{width:78%; height:78%; display:block; pointer-events:none}
.cell.flag{background:linear-gradient(145deg,#4c1d95,#3b0764)}
.cell.fox{background:linear-gradient(145deg,#7f1d1d,#450a0a); box-shadow:inset 0 0 0 1px rgba(248,113,113,0.35)}
.cell.boom{background:linear-gradient(145deg,#ef4444,#b91c1c); animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-4px) rotate(-4deg)}40%{transform:translateX(4px) rotate(4deg)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.cell.wrong{background:linear-gradient(145deg,#334155,#1e293b); opacity:.8}
.cell.wrong::after{
  content:'✕'; position:absolute; font-size:60%; color:#fca5a5;
  font-family:'Bangers',cursive; text-shadow:0 0 6px rgba(0,0,0,.6);
}
.cell.hint{animation:hintglow 1s ease-out}
@keyframes hintglow{from{box-shadow:0 0 0 3px rgba(255,215,0,.9)}to{box-shadow:0 0 0 3px rgba(255,215,0,0)}}
.n1{color:#7dd3fc}.n2{color:#a3e635}.n3{color:#fca5a5}.n4{color:#c084fc}
.n5{color:#fbbf24}.n6{color:#2dd4bf}.n7{color:#f9a8d4}.n8{color:#e5e7eb}

/* GAME BONUS BAR */
.bonus-bar{display:flex; gap:6px; flex-wrap:wrap; justify-content:center; width:100%; max-width:480px; margin:10px auto 0}
.bonus-btn{
  background:rgba(124,58,237,0.3); border:1.5px solid rgba(168,85,247,0.4);
  border-radius:12px; padding:8px 14px; font-family:'Fredoka One',cursive; font-size:12px;
  color:#fff; cursor:pointer; touch-action:manipulation; transition:transform .1s;
}
.bonus-btn:active{transform:scale(0.93)}
.bonus-btn.used{opacity:.3; pointer-events:none}
.bonus-btn.flagmode{background:rgba(239,68,68,0.35); border-color:rgba(252,165,165,0.7)}

/* OVERLAYS / MODAL */
.overlay{
  position:fixed; inset:0; z-index:50; display:none;
  align-items:center; justify-content:center; padding:24px;
  background:rgba(5,2,15,0.82); backdrop-filter:blur(6px);
}
.overlay.show{display:flex; animation:fadein .25s}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.modal{
  width:100%; max-width:340px; text-align:center;
  background:linear-gradient(145deg,rgba(13,5,32,0.98),rgba(30,10,65,0.98));
  border:2px solid rgba(180,100,255,0.4); border-radius:24px; padding:26px 22px;
  box-shadow:0 0 60px rgba(120,40,200,0.5); animation:pop .3s cubic-bezier(.2,1.4,.5,1)
}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.modal img{width:120px; height:120px; object-fit:contain; margin-bottom:10px; filter:drop-shadow(0 6px 16px rgba(0,0,0,0.6))}
.modal h2{font-family:'Bangers',cursive; font-size:30px; letter-spacing:2px; margin-bottom:8px}
.modal h2.win{color:var(--green-l); text-shadow:0 0 20px rgba(163,230,53,0.5)}
.modal h2.lose{color:#fca5a5; text-shadow:0 0 20px rgba(239,68,68,0.4)}
.modal h2.locked{color:var(--orange-l)}
.modal p{font-size:13px; color:var(--muted); line-height:1.7; margin-bottom:18px}
.modal p b{color:var(--gold)}
.modal .modal-score{font-family:'Bangers',cursive; font-size:26px; color:var(--green-l); margin:6px 0 14px; letter-spacing:1px}
.modal .mbtn{
  width:100%; padding:14px; border:none; border-radius:14px; margin-bottom:10px;
  font-family:'Bangers',cursive; font-size:18px; letter-spacing:1px; color:#fff;
  cursor:pointer; touch-action:manipulation; transition:transform .1s;
}
.modal .mbtn:active{transform:scale(0.96)}

/* BRAVO — plays over everything when a record falls */
.bravo{
  position:fixed; inset:0; z-index:90; display:none;
  align-items:center; justify-content:center; flex-direction:column;
  pointer-events:none; overflow:hidden;
}
.bravo.show{display:flex; animation:bravoScrim 1.9s ease-out forwards}
@keyframes bravoScrim{
  0%{background:rgba(5,2,15,0)}
  15%{background:rgba(5,2,15,.72)}
  75%{background:rgba(5,2,15,.72)}
  100%{background:rgba(5,2,15,0)}
}
.bravo::before{
  content:''; position:absolute; inset:0;
  background:radial-gradient(circle at 50% 45%,rgba(255,215,0,0.30),transparent 62%);
  animation:bravoFlash 1.9s ease-out forwards;
}
@keyframes bravoFlash{0%{opacity:0}18%{opacity:1}100%{opacity:0}}
.bravo-txt{
  position:relative;
  font-family:'Bangers',cursive; font-size:clamp(52px,19vw,120px); letter-spacing:5px;
  background:linear-gradient(180deg,#fff8c9 5%,#FFD700 45%,#f59e0b 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 0 26px rgba(255,215,0,.75)) drop-shadow(0 5px 0 rgba(0,0,0,.35));
  animation:bravoPop .55s cubic-bezier(.15,1.7,.4,1) both, bravoBeat 1s .55s ease-in-out 1;
}
@keyframes bravoPop{0%{transform:scale(.25) rotate(-16deg);opacity:0}60%{transform:scale(1.18) rotate(4deg);opacity:1}100%{transform:scale(1) rotate(-2deg);opacity:1}}
@keyframes bravoBeat{0%,100%{transform:scale(1) rotate(-2deg)}50%{transform:scale(1.09) rotate(2deg)}}
.bravo-sub{
  position:relative; margin-top:6px; font-family:'Fredoka One',cursive;
  font-size:15px; color:#fff; text-align:center; padding:0 24px; line-height:1.5;
  text-shadow:0 2px 10px rgba(0,0,0,.7);
  animation:bravoSub .5s .35s both;
}
@keyframes bravoSub{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.bravo-c{
  position:absolute; top:48%; left:50%; font-size:26px;
  animation:bravoConf 1.7s ease-out forwards;
}
@keyframes bravoConf{
  0%{transform:translate(-50%,-50%) scale(.3) rotate(0deg); opacity:0}
  12%{opacity:1}
  100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.1) rotate(var(--rot)); opacity:0}
}

/* TOAST */
.toast{
  position:fixed; bottom:80px; left:50%; transform:translateX(-50%) translateY(20px);
  background:rgba(124,58,237,0.95); color:#fff; padding:12px 18px; border-radius:14px;
  font-size:13px; z-index:70; opacity:0; transition:opacity .25s,transform .25s; max-width:90%;
  text-align:center; box-shadow:0 6px 24px rgba(0,0,0,0.5); pointer-events:none; font-family:'Fredoka One',cursive;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
.hidden{display:none!important}

</style>
</head>
<body>
<div class="app">

  <div class="brand">
    <img alt="Francis" id="brandImg" src="assets/francis-default.webp">
    <h1>FRANCIS<br>LE COQ</h1>
    <div class="tagline" id="tagline">CHICKEN MINES</div>
  </div>

  <!-- MENU -->
  <div class="card" id="screenMenu">
    <button class="menu-btn btn-comp-green" onclick="show('screenLevels')">
      <span class="ico">▶️</span><span id="lblResume">JOUER</span>
    </button>
    <button class="menu-btn btn-wallet" id="btnWallet" onclick="goConnectWallet()">
      <span class="ico">👛</span>
      <span class="wallet-text"><span id="lblWallet">CONNECT WALLET</span><span class="wallet-sub" id="walletSub"></span></span>
      <span class="lock" id="walletLock"></span>
    </button>
    <div class="status-bar" id="statusBar"></div>
    <div class="lang-row">
      <button class="flag-btn" id="flagFR" onclick="setLang('fr')">
        <svg viewBox="0 0 3 2"><rect width="1" height="2" x="0" fill="#0055A4"/><rect width="1" height="2" x="1" fill="#fff"/><rect width="1" height="2" x="2" fill="#EF4135"/></svg>
      </button>
      <button class="flag-btn" id="flagEN" onclick="setLang('en')">
        <svg viewBox="0 0 60 30"><clipPath id="ukc"><rect width="60" height="30"/></clipPath><g clip-path="url(#ukc)"><rect width="60" height="30" fill="#012169"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#C8102E" stroke-width="4"/><path d="M30,0 V30 M0,15 H60" stroke="#fff" stroke-width="10"/><path d="M30,0 V30 M0,15 H60" stroke="#C8102E" stroke-width="6"/></g></svg>
      </button>
    </div>
  </div>

  <!-- LEVELS -->
  <div class="card hidden" id="screenLevels">
    <button class="back-btn" id="backLevels" onclick="show('screenMenu')">Retour</button>
    <div class="sec-title">🗺️ <span id="levelsTitle">NIVEAUX</span></div>
    <div class="sec-sub" id="levelsSub">Choisis ton niveau</div>
    <div id="levelList"></div>
    <div class="total-box"><span id="lblTotal">Score total</span><b id="totalScore">0</b></div>
  </div>

  <!-- GAME -->
  <div class="card hidden" id="screenGame">
    <div class="game-top">
      <button class="back-btn" id="backGame" style="margin-bottom:0;width:auto;padding:8px 12px" onclick="quitGame()">Menu</button>
      <span class="lvl-badge" id="gameLvl"></span>
    </div>
    <div class="hud" id="hud"></div>
    <div class="board-wrap"><div class="board" id="board"></div></div>
    <div class="bonus-bar" id="bonusBar"></div>
  </div>

</div>

<!-- MODAL -->
<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>
<div class="bravo" id="bravo"></div>
<div class="toast" id="toast"></div>

<script>
/* Visuels repris de Chicken Reflex : PNG/WebP détourés (fond transparent) */
const IMG = {
  defaut: "assets/francis-default.webp",
  happy:  "assets/francis-happy.webp",
  sad:    "assets/francis-sad.webp",
  roi:    "assets/roi.webp"
};
'use strict';
/* ============================================================
   FRANCIS LE COQ — CHICKEN MINES (démineur)
   Menu & design system reused from "Chicken Snake"
   Les mines sont des RENARDS 🦊
   ============================================================ */

const tg = window.Telegram?.WebApp;
const WALLET_PAGE = 'https://franclecoq.github.io/Wallet/connect-wallet.html';
const BACKEND     = 'https://mubqtnqulpyehkgubhnh.supabase.co/functions/v1';

/* ---------- Sprites (SVG inline — aucun asset renard n'existait) ---------- */
const SVG_FOX = `<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <path d="M7 6 L28 23 L10 33 Z" fill="#d9541a"/>
  <path d="M13 13 L25 24 L15 28 Z" fill="#ffc9a8"/>
  <path d="M57 6 L36 23 L54 33 Z" fill="#d9541a"/>

async function detectHolder(){
  if(tg?.initData){
    try{
      const res=await fetch(BACKEND+'/check-franc',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({initData:tg.initData})
      });
      const d=await res.json();
      walletLinked = !!(d && d.walletLinked);
      isHolder = !!(d && (d.unlocked ?? (d.walletLinked && d.hasFranc)));
      unlockReason = (d && d.reason) || (isHolder ? 'solana' : null);
      francBalance = isHolder ? Number(d.balance || 0) : 0;
      localStorage.setItem('flc_holder',JSON.stringify(isHolder));

      localStorage.setItem('flc_walletLinked',JSON.stringify(walletLinked));
      localStorage.setItem('flc_reason', unlockReason || '');

  }
  renderWalletStatus(); renderStatusBar(); renderLevelList();
}

/* ============================================================
   GAME ENGINE — Démineur
   ============================================================ */
const boardEl = document.getElementById('board');

let lvlId=1;
let COLS=8, ROWS=8, FOXES=6;
let cells=[];        // {fox,n,rev,flag,el}
let seeded=false;    // mines placed after the first reveal (first click is always safe)
let running=false, finished=false;
let revealedCount=0, flagCount=0;
let startTime=0, elapsed=0, timerId=null;
let flagMode=false;
let bStock={detect:0,mark:0,shield:0};
let shieldOn=false;

function lcfg(){ return LEVELS.find(l=>l.id===lvlId); }
const idx=(x,y)=>y*COLS+x;
function neighbours(i){
  const x=i%COLS, y=(i/COLS)|0, out=[];
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
    if(!dx&&!dy) continue;
    const nx=x+dx, ny=y+dy;
    if(nx<0||ny<0||nx>=COLS||ny>=ROWS) continue;
    out.push(idx(nx,ny));
  }
  return out;
}

function startLevel(id){
  const lv=LEVELS.find(l=>l.id===id);
  if(!canPlay(lv)){ showLockModal(); return; }
  closeModal();
  lvlId=id;
  COLS=lv.cols; ROWS=lv.rows; FOXES=lv.foxes;

  const cumul=getCumul();
  bStock={ detect:cumul>=300?1:0, mark:cumul>=700?1:0, shield:cumul>=1200?1:0 };
  shieldOn=false; flagMode=false;

  cells=[]; seeded=false; finished=false; running=true;
  revealedCount=0; flagCount=0; elapsed=0;
  buildBoard();
  fitBoard();
  renderHUD(); renderBonus();

  document.getElementById('gameLvl').textContent = t('worlds')[lv.world]+' · '+lv.id+'. '+LEVEL_NAMES[lang][lv.id-1];
  show('screenGame');
  fitBoard();

  startTime=performance.now();
  clearInterval(timerId);
  timerId=setInterval(()=>{ if(!finished){ elapsed=(performance.now()-startTime)/1000; renderHUD(); } },250);

  showLevelNotice(lv);
}

function stopGame(){ running=false; clearInterval(timerId); timerId=null; }

function showLevelNotice(lv){

  let msg;

/* ---------- Board build & layout ---------- */
function buildBoard(){
  boardEl.innerHTML='';
  boardEl.style.gridTemplateColumns=`repeat(${COLS},1fr)`;
  const frag=document.createDocumentFragment();
  for(let i=0;i<COLS*ROWS;i++){
    const el=document.createElement('div');
    el.className='cell';
    el.dataset.i=i;
    cells.push({fox:false,n:0,rev:false,flag:false,el});
    frag.appendChild(el);
  }
  boardEl.appendChild(frag);
}

function fitBoard(){
  const gap=3, pad=8;
  const availW=Math.min(window.innerWidth-20,480);
  // leave room for the top bar, hud and bonus bar
  const availH=window.innerHeight-210;
  const cw=(availW-pad*2-gap*(COLS-1))/COLS;
  const ch=(availH-pad*2-gap*(ROWS-1))/ROWS;
  const cell=Math.max(20,Math.floor(Math.min(cw,ch)));
  const w=cell*COLS+gap*(COLS-1)+pad*2;
  boardEl.style.width=w+'px';
  boardEl.style.fontSize=Math.round(cell*0.62)+'px';
}
window.addEventListener('resize',()=>{ if(running) fitBoard(); });

/* ---------- Mine seeding (first tap is always safe) ---------- */
function seed(safeIdx){
  const forbidden=new Set([safeIdx,...neighbours(safeIdx)]);
  const total=COLS*ROWS;
  // if the board is too tight to keep a full safe 3×3, only protect the tapped cell
  const pool=[];
  for(let i=0;i<total;i++){ if(!forbidden.has(i)) pool.push(i); }
  const src = pool.length>=FOXES ? pool : Array.from({length:total},(_,i)=>i).filter(i=>i!==safeIdx);
  for(let k=src.length-1;k>0;k--){ const j=(Math.random()*(k+1))|0; [src[k],src[j]]=[src[j],src[k]]; }
  src.slice(0,FOXES).forEach(i=>{ cells[i].fox=true; });
  for(let i=0;i<total;i++){
    if(cells[i].fox){ cells[i].n=-1; continue; }
    cells[i].n=neighbours(i).filter(j=>cells[j].fox).length;
  }
  seeded=true;
}

/* ---------- Painting ---------- */
function paint(i){
  const c=cells[i], el=c.el;
  el.className='cell';
  el.innerHTML='';
  if(c.rev){
    el.classList.add('rev');
    if(c.fox){ el.classList.add('fox'); el.innerHTML=SVG_FOX; }
    else if(c.n>0){ el.classList.add('n'+c.n); el.textContent=c.n; }
  } else if(c.flag){
    el.classList.add('flag'); el.innerHTML=SVG_FLAG;
  }
}
function paintAll(){ for(let i=0;i<cells.length;i++) paint(i); }

/* ---------- Reveal ---------- */
function reveal(i){
  const c=cells[i];
  if(c.rev||c.flag) return;
  if(!seeded) seed(i);
  if(c.fox){
    if(shieldOn){
      shieldOn=false;
      c.flag=true; flagCount++;
      paint(i); renderHUD(); renderBonus();
      toast(t('shieldSave')); buzz('heavy');
      return;
    }
    c.rev=true; paint(i); c.el.classList.add('boom');
    lose();
    return;
  }
  // flood fill on empty cells
  const stack=[i];
  while(stack.length){
    const k=stack.pop();
    const cc=cells[k];
    if(cc.rev||cc.flag||cc.fox) continue;
    cc.rev=true; revealedCount++; paint(k);
    if(cc.n===0) neighbours(k).forEach(j=>{ if(!cells[j].rev&&!cells[j].flag) stack.push(j); });
  }
  buzz('light');
  checkWin();
}

/* chording: tap a number whose flags already match → open the rest */
function chord(i){
  const c=cells[i];
  if(!c.rev||c.n<=0) return;
  const nb=neighbours(i);
  const flags=nb.filter(j=>cells[j].flag).length;
  if(flags!==c.n) return;
  nb.forEach(j=>{ if(!cells[j].flag&&!cells[j].rev) reveal(j); });
}

function toggleFlag(i){
  const c=cells[i];
  if(c.rev||finished) return;
  c.flag=!c.flag;
  flagCount+=c.flag?1:-1;
  paint(i); renderHUD(); buzz('medium');
}

function checkWin(){
  if(finished) return;
  const safeTotal=COLS*ROWS-FOXES;
  if(revealedCount>=safeTotal) win();
}

/* ---------- End of game ---------- */
function lose(){
  finished=true; stopGame();
  cells.forEach((c,i)=>{
    if(c.fox && !c.rev && !c.flag){ c.rev=true; paint(i); }
    else if(!c.fox && c.flag){ c.el.className='cell wrong'; c.el.innerHTML=''; }
  });
  buzz('heavy');
  setTimeout(()=>{
    const m=document.getElementById('modal');
    m.innerHTML=`<img src="${IMG.sad}" alt="">
      <h2 class="lose">🦊 ${t('gameOver')}</h2>
      <p>${t('goText')}</p>
      <button class="mbtn btn-comp-green" onclick="startLevel(${lvlId})">${t('replay')}</button>
      <button class="mbtn btn-purple" onclick="closeModal();show('screenLevels')">${t('toLevels')}</button>`;
    document.getElementById('overlay').classList.add('show');
  },700);
}

function scoreFor(lv,sec){
  const base=lv.foxes*20;
  const par=lv.foxes*8;                               // "par time" in seconds
  const speed=Math.max(0,Math.round(base*(1-sec/par)));
  return base+speed;
}

/* Big animated BRAVO — fires whenever a record falls (score, time, or both) */
function showBravo(kind){
  const el=document.getElementById('bravo');
  const sub = kind==='both' ? t('recBoth') : kind==='time' ? t('recTime') : t('recScore');
  const confetti=['🎉','🏅','⭐','🎊','🦊','🥇','✨','🐔'];
  let parts='';
  for(let k=0;k<14;k++){
    const ang=(Math.PI*2*k)/14 + Math.random()*.4;
    const dist=110+Math.random()*130;
    parts+=`<span class="bravo-c" style="--dx:${Math.round(Math.cos(ang)*dist)}px;--dy:${Math.round(Math.sin(ang)*dist)}px;--rot:${Math.round(-180+Math.random()*360)}deg;animation-delay:${(Math.random()*.25).toFixed(2)}s">${confetti[k%confetti.length]}</span>`;
  }
  el.innerHTML=`${parts}<div class="bravo-txt">${t('bravo')}</div><div class="bravo-sub">${sub}</div>`;
  el.classList.add('show');
  buzz('heavy');
  clearTimeout(el._t);
  el._t=setTimeout(()=>{ el.classList.remove('show'); el.innerHTML=''; },1900);
}

function win(){
  finished=true;
  elapsed=(performance.now()-startTime)/1000;
  stopGame();
  // auto-flag the foxes that are left
  cells.forEach((c,i)=>{ if(c.fox&&!c.flag){ c.flag=true; flagCount++; paint(i); } });
  renderHUD();
  const lv=lcfg();
  const sec=elapsed;
  const sc=scoreFor(lv,sec);
  const scoreRec=saveBest(lv.id,sc);
  const timeRec=saveBestTime(lv.id,sec);
  const kind = scoreRec&&timeRec ? 'both' : timeRec ? 'time' : scoreRec ? 'score' : null;
  buzz('heavy');
  if(kind) showBravo(kind);
  setTimeout(()=>{
    const m=document.getElementById('modal');
    const next=LEVELS.find(l=>l.id===lvlId+1);
    const nextBtn = next
      ? `<button class="mbtn btn-comp-green" onclick="startLevel(${next.id})">▶️ ${next.id}. ${LEVEL_NAMES[lang][next.id-1]}</button>`
      : '';
    const recLine = kind==='both' ? t('recBoth') : kind==='time' ? t('recTime') : kind==='score' ? t('recScore') : '';
    m.innerHTML=`<img src="${IMG.happy}" alt="">
      <h2 class="win">🏆 ${t('winTitle')}</h2>
      <p>${t('winText')}</p>
      <div class="modal-score">🎖️ ${sc} ${t('pts')}<br>🎖️ ${fmtTime(sec)}</div>
      ${recLine?`<p style="margin-top:-8px">🎉 ${recLine}</p>`:''}
      ${nextBtn}
      <button class="mbtn btn-purple" onclick="startLevel(${lvlId})">${t('replay')}</button>
      <button class="mbtn btn-wallet" onclick="closeModal();show('screenLevels')">${t('toLevels')}</button>`;
    document.getElementById('overlay').classList.add('show');
  }, kind ? 1900 : 500);
}

function fmtTime(s){
  const m=Math.floor(s/60), r=Math.floor(s%60);
  return m+':'+String(r).padStart(2,'0');
}

/* ---------- HUD ---------- */
function renderHUD(){
  const hud=document.getElementById('hud');
  const best=bestByLevel[lvlId]||0;
  const bt=timeByLevel[lvlId];
  hud.innerHTML=`
    <div class="chip foxes"><span class="lab">${t('foxes')}</span><span class="num">🦊 ${FOXES-flagCount}</span></div>
    <div class="chip time"><span class="lab">${t('time')}</span><span class="num">${fmtTime(elapsed)}</span></div>
    <div class="chip best"><span class="lab">🎖️ ${t('best')}</span><span class="num">${best} · ${bt===undefined?t('noRec'):fmtTime(bt)}</span></div>`;
}

/* ---------- Bonus bar ---------- */
function renderBonus(){
  const bar=document.getElementById('bonusBar');
  bar.innerHTML='';
  const mk=(label,cls,fn,enabled)=>{
    const b=document.createElement('button');
    b.className='bonus-btn'+(enabled?'':' used')+(cls?' '+cls:'');
    b.textContent=label;
    b.onclick=fn;
    bar.appendChild(b);
    return b;
  };
  mk(t('bonusFlag'), flagMode?'flagmode':'', ()=>{ flagMode=!flagMode; renderBonus(); }, true);
  mk(t('bonusDetect'),'', useDetect, bStock.detect>0);
  mk(t('bonusMark'),  '', useMark,   bStock.mark>0);
  mk(t('bonusShield'),'', useShield, bStock.shield>0);
}

function useDetect(){
  if(bStock.detect<1||finished) return;
  if(!seeded){ reveal(((Math.random()*cells.length)|0)); bStock.detect--; renderBonus(); return; }
  const pool=cells.map((c,i)=>i).filter(i=>!cells[i].fox&&!cells[i].rev&&!cells[i].flag);
  if(!pool.length){ toast(t('noSafe')); return; }
  const i=pool[(Math.random()*pool.length)|0];
  bStock.detect--;
  reveal(i);
  cells[i].el.classList.add('hint');
  renderBonus();
}
function useMark(){
  if(bStock.mark<1||finished||!seeded) return;
  const pool=cells.map((c,i)=>i).filter(i=>cells[i].fox&&!cells[i].flag&&!cells[i].rev);
  if(!pool.length){ toast(t('noFox')); return; }
  const i=pool[(Math.random()*pool.length)|0];
  bStock.mark--;
  toggleFlag(i);
  cells[i].el.classList.add('hint');
  renderBonus();
}
function useShield(){
  if(bStock.shield<1||finished||shieldOn) return;
  bStock.shield--; shieldOn=true;
  toast(t('shieldOn'));
  renderBonus();
}

/* ---------- Controls (tap / long-press / right-click) ---------- */
let pressIdx=-1, pressTimer=null, longFired=false, pressXY=null;

function cellIndexFromEvent(e){
  const el=e.target.closest('.cell');
  if(!el||!boardEl.contains(el)) return -1;
  return +el.dataset.i;
}

boardEl.addEventListener('pointerdown',e=>{
  if(finished||!running) return;
  const i=cellIndexFromEvent(e);
  if(i<0) return;
  pressIdx=i; longFired=false; pressXY={x:e.clientX,y:e.clientY};
  clearTimeout(pressTimer);
  pressTimer=setTimeout(()=>{ longFired=true; toggleFlag(i); },420);
});
boardEl.addEventListener('pointermove',e=>{
  if(pressIdx<0||!pressXY) return;
  if(Math.hypot(e.clientX-pressXY.x,e.clientY-pressXY.y)>12){ clearTimeout(pressTimer); pressIdx=-1; }
});
boardEl.addEventListener('pointerup',e=>{
  clearTimeout(pressTimer);
  if(finished||!running){ pressIdx=-1; return; }
  const i=cellIndexFromEvent(e);
  if(i<0||i!==pressIdx){ pressIdx=-1; return; }
  pressIdx=-1;
  if(longFired){ longFired=false; return; }
  const c=cells[i];
  if(c.rev) chord(i);
  else if(flagMode) toggleFlag(i);
  else reveal(i);
});
boardEl.addEventListener('pointercancel',()=>{ clearTimeout(pressTimer); pressIdx=-1; });
boardEl.addEventListener('contextmenu',e=>{
  e.preventDefault();
  if(finished||!running) return;
  const i=cellIndexFromEvent(e);
  if(i>=0) toggleFlag(i);
});

/* ---------- Init ---------- */
function init(){
  if(tg){try{tg.ready();tg.expand();}catch(e){}}
  setLang(lang);
  renderWalletStatus(); renderStatusBar(); renderLevelList();
  detectHolder();
}
init();

</script>
